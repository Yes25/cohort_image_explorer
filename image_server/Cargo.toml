[package]
name = "image_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = [
    "cors",
    "trace",
    "compression-gzip",
    "fs",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
dotenvy = "0.15.7"

rust-s3 = "0.37.2"
base64 = "0.22.1"
tar = "0.4.44"

image = "0.25.5"
dicom = { version = "0.9.1", features = ["image"] }
nifti_decoder = { path = "../nifti_decoder" }
